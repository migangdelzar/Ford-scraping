name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scraping-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ford_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ford_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Workflow and container contracts
        run: node --test scripts/container-contract.test.mjs

      - name: API tests
        run: npm test -- --run tests/api

      - name: Run database migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ford_test
          FORD_BASE_URL: https://www.ford.mx/

      - name: Run integration tests
        run: npm run test:integration
        env:
          FORD_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ford_test

  container:
    name: Build and smoke test scheduler image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build the local CI image without publishing
        run: docker build --pull --tag ford-scraping:ci .

      - name: Smoke test the monthly scheduler command
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name ford-scheduler-smoke \
            --network host \
            --env DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/ford_test \
            --env FORD_BASE_URL=https://www.forduruapan.mx \
            --env SYNC_SCHEDULE='0 12 1 * *' \
            --env SYNC_TIMEZONE=America/Mexico_City \
            ford-scraping:ci
          trap 'docker rm --force ford-scheduler-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker logs ford-scheduler-smoke 2>&1 | grep -Fq 'Scheduler active: 0 12 1 * * (America/Mexico_City)'; then
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' ford-scheduler-smoke)" != true ]]; then
              docker logs ford-scheduler-smoke
              exit 1
            fi
            sleep 2
          done
          docker logs ford-scheduler-smoke
          echo 'Scheduler did not report its configured monthly schedule.' >&2
          exit 1


  publish:
    name: Publish versioned scraper image
    if: >-
      github.event_name == 'push' && github.ref_type == 'tag' &&
      startsWith(github.ref, 'refs/tags/v')
    needs: [test, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the verified tag source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify immutable SemVer tag is on main
        env:
          VERSION: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'Release version must use vMAJOR.MINOR.PATCH.' >&2
            exit 1
          }
          [[ "$(git cat-file -t "refs/tags/${VERSION}")" == tag ]] || {
            echo 'Release version must be an annotated tag.' >&2
            exit 1
          }
          [[ "$(git rev-parse "refs/tags/${VERSION}^{commit}")" == "${SOURCE_SHA}" ]] || {
            echo 'Release tag target does not match the workflow source SHA.' >&2
            exit 1
          }
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${SOURCE_SHA}" refs/remotes/origin/main || {
            echo 'Release tag target is not reachable from main.' >&2
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v3

      - name: Normalize GHCR image name
        id: image-name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build ARM64 image archive for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.image-name.outputs.name }}:sha-${{ github.sha }}
          platforms: linux/arm64
          outputs: type=docker,dest=/tmp/ford-scraping.tar
          provenance: false
          sbom: false

      - name: Scan versioned image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/ford-scraping.tar
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          limit-severities-for-sarif: true
          exit-code: '1'

      - name: Upload versioned image scan report
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif

      - name: Log in to GHCR after the image passes its scan
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish scanned versioned image
        id: publish
        env:
          IMAGE_REPOSITORY: ${{ steps.image-name.outputs.name }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker load --input /tmp/ford-scraping.tar
          sha_tag="${IMAGE_REPOSITORY}:sha-${SOURCE_SHA}"
          version_tag="${IMAGE_REPOSITORY}:${VERSION}"
          plain_version_tag="${IMAGE_REPOSITORY}:${VERSION#v}"
          for tag in "${version_tag}" "${plain_version_tag}"; do
            if docker buildx imagetools inspect "${tag}" >/dev/null 2>&1; then
              echo "Version image alias already exists: ${tag}" >&2
              exit 1
            fi
          done
          docker push "${sha_tag}" | tee "$RUNNER_TEMP/docker-push.log"
          docker tag "${sha_tag}" "${version_tag}"
          docker tag "${sha_tag}" "${plain_version_tag}"
          docker push "${version_tag}"
          docker push "${plain_version_tag}"
          digest="$(sed -n 's/^.*digest: \(sha256:[0-9a-f]*\).*$/\1/p' "$RUNNER_TEMP/docker-push.log" | tail -1)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo 'Could not resolve published image digest.' >&2
            exit 1
          }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Expose immutable image reference
        id: image
        env:
          IMAGE_REPOSITORY: ${{ steps.image-name.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "image=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate versioned image SBOM
        uses: anchore/sbom-action@v0.20.0
        with:
          image: ${{ steps.image-name.outputs.name }}:sha-${{ github.sha }}
          format: cyclonedx-json
          output-file: ford-scraping-sbom.cdx.json
          artifact-name: ford-scraping-sbom-${{ github.sha }}.cdx.json

      - name: Attest versioned image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image-name.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Verify versioned image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.image }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh attestation verify "oci://${IMAGE}" \
            --bundle-from-oci \
            --repo "${GITHUB_REPOSITORY}" \
            --source-ref "refs/tags/${VERSION}" \
            --source-digest "${SOURCE_SHA}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ci.yml"

      - name: Summarize immutable scraper image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ github.ref_name }}
        run: |
          {
            echo '### Ford-scraping scheduler image'
            echo "- Version: ${VERSION}"
            echo "- Source: ${SOURCE_SHA}"
            echo "- Immutable image: ${IMAGE}"
            echo '- Vulnerability scan: passed'
            echo '- SBOM and tag-bound build provenance: verified'
          } >> "$GITHUB_STEP_SUMMARY"
