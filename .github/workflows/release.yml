name: Release MCP to OCI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Validate this release workflow, deploy verified main, or restore the prior image.
        required: true
        default: deploy
        type: choice
        options: [validate, deploy, rollback]
      source_sha:
        description: Full 40-character SHA with successful CI on main (deploy only).
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ford-mcp-production
  cancel-in-progress: false

jobs:
  contract:
    name: Verify release contract without publishing
    if: github.event_name == 'push' || inputs.operation == 'validate'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm this is a validation-only event
        run: echo "No image publishing or deployment was requested."

  verify:
    name: Verify release source
    if: inputs.operation != 'validate'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Validate source SHA
        if: inputs.operation == 'deploy'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Deploy requires a full 40-character lowercase source SHA." >&2
            exit 1
          }
      - name: Require successful main CI for deploy
        if: inputs.operation == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=${SOURCE_SHA}")"
          jq -e --arg sha "$SOURCE_SHA" \
            '.workflow_runs | any(.head_sha == $sha and .head_branch == "main" and .conclusion == "success")' \
            <<<"$runs" >/dev/null || {
            echo "Source SHA has no successful push verification run on main." >&2
            exit 1
          }

  image:
    name: Build and scan immutable MCP image
    if: inputs.operation == 'deploy'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v3
      - name: Set up image build cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: scraping-arm64-${{ inputs.source_sha }}
          restore-keys: scraping-arm64-
      - name: Normalize GHCR image name
        id: image-name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.image-name.outputs.name }}:sha-${{ inputs.source_sha }}
          platforms: linux/arm64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          push: true
          provenance: false
          sbom: false
      - name: Rotate image build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
      - name: Expose immutable image digest
        id: image
        env:
          IMAGE_REPOSITORY: ${{ steps.image-name.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Pull image for scan
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker pull "$IMAGE"
      - name: Scan image
        id: scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          limit-severities-for-sarif: true
          exit-code: '1'
      - name: Upload image scan report
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
      - name: Generate image SBOM
        uses: anchore/sbom-action@v0.20.0
        with:
          image: ${{ steps.image.outputs.image }}
          format: cyclonedx-json
          output-file: ford-scraping-sbom.cdx.json
          artifact-name: ford-scraping-sbom-${{ inputs.source_sha }}.cdx.json
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image-name.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Summarize immutable scraper release
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          {
            echo '### Ford-scraping container'
            echo "- Source: ${SOURCE_SHA}"
            echo "- Immutable image: ${IMAGE}"
            echo '- Vulnerability scan: passed'
            echo '- SBOM and build provenance: attached'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy or roll back Ford MCP
    needs: [contract, verify, image]
    if: >-
      always() && needs.contract.result == 'success' && needs.verify.result == 'success' &&
      (inputs.operation == 'rollback' || needs.image.result == 'success') &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      vars.RUNTIME_VAULT_READY == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy using the shared OCI action
        uses: migangdelzar/Ford-oci-deployment-action/.github/actions/oci-blue-green@f8112024deea512ffebe8a7b49df531a29dad027
        with:
          target: ford-mcp
          operation: ${{ inputs.operation }}
          image: ${{ inputs.operation == 'rollback' && '' || needs.image.outputs.image }}
          source-sha: ${{ inputs.operation == 'rollback' && 'recorded-rollback' || inputs.source_sha }}
          host: ${{ vars.OCI_MCP_HOST }}
          user: ${{ vars.OCI_DEPLOY_USER }}
          ssh-private-key: ${{ secrets.OCI_MCP_SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
          registry-username: ${{ github.actor }}
          registry-token: ${{ github.token }}
          mcp-private-ip: ${{ vars.OCI_MCP_PRIVATE_IP }}
