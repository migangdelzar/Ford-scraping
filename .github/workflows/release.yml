name: Release MCP to OCI
run-name: ${{ format('Release MCP to OCI [{0}] {1} {2}', inputs.release_request_id || 'manual', inputs.version || 'rollback', inputs.source_sha || 'recorded') }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate this release workflow, publish/deploy a versioned release, or restore the prior image.
        required: true
        default: deploy
        type: choice
        options: [validate, deploy, rollback]
      version:
        description: Immutable annotated vMAJOR.MINOR.PATCH tag (deploy only).
        required: false
        type: string
      source_sha:
        description: Full SHA targeted by the version tag (deploy only).
        required: false
        type: string
      release_request_id:
        description: Coordinator correlation ID used to track release-all requests.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ford-mcp-production
  cancel-in-progress: false

jobs:
  contract:
    name: Verify release contract without publishing
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm release jobs enforce their own operation gates
        run: echo "Release event contract accepted; publication and deployment remain separately gated."

  verify:
    name: Verify release source
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.operation != 'validate'
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.source.outputs.operation }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.source.outputs.version }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out release tooling from main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve the verified release source
        id: source
        env:
          REQUESTED_OPERATION: ${{ inputs.operation }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          operation="${REQUESTED_OPERATION}"
          source_sha="${REQUESTED_SHA}"
          version="${INPUT_VERSION}"
          if [[ "${operation}" == "rollback" ]]; then
            source_sha=recorded-rollback
          fi
          if [[ "${operation}" == "deploy" ]]; then
            [[ "${version}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              echo "Deploy requires a canonical vMAJOR.MINOR.PATCH version." >&2
              exit 1
            }
            [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Deploy requires a full source SHA." >&2
              exit 1
            }
            git fetch --no-tags origin "refs/tags/${version}:refs/tags/${version}"
            [[ "$(git cat-file -t "refs/tags/${version}")" == tag ]] || {
              echo "Release version must be an annotated tag." >&2
              exit 1
            }
            [[ "$(git rev-parse "refs/tags/${version}^{commit}")" == "${source_sha}" ]] || {
              echo "Release tag target does not match the selected source SHA." >&2
              exit 1
            }
            git merge-base --is-ancestor "${source_sha}" refs/remotes/origin/main || {
              echo "Release tag target is not reachable from main." >&2
              exit 1
            }
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${source_sha}&event=push&status=success&per_page=100")"
            jq -e --arg sha "${source_sha}" --arg version "${version}" \
            '.workflow_runs | any(.head_sha == $sha and .head_branch == $version and .conclusion == "success")' \
            <<<"${runs}" >/dev/null || {
              echo "Version tag has no successful push CI run for its exact source SHA." >&2
              exit 1
            }
          elif [[ "${operation}" != "rollback" ]]; then
            echo "Unsupported release operation: ${operation}" >&2
            exit 1
          fi
          echo "operation=${operation}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  image:
    name: Build and scan immutable MCP image
    if: needs.verify.result == 'success' && needs.verify.outputs.operation == 'deploy'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v3
      - name: Set up image build cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: scraping-arm64-${{ needs.verify.outputs.source_sha }}
          restore-keys: scraping-arm64-
      - name: Normalize GHCR image name
        id: image-name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build image archive for scanning
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.image-name.outputs.name }}:sha-${{ needs.verify.outputs.source_sha }}
          platforms: linux/arm64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          outputs: type=docker,dest=/tmp/ford-scraping.tar
          provenance: false
          sbom: false
      - name: Rotate image build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
      - name: Scan image
        id: scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/ford-scraping.tar
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          limit-severities-for-sarif: true
          exit-code: '1'
      - name: Upload image scan report
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
      - name: Log in to GHCR after the image passes its scan
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Load and publish the scanned image
        id: publish
        env:
          IMAGE_REPOSITORY: ${{ steps.image-name.outputs.name }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          docker load --input /tmp/ford-scraping.tar
          sha_tag="${IMAGE_REPOSITORY}:sha-${SOURCE_SHA}"
          version_tag="${IMAGE_REPOSITORY}:${VERSION}"
          plain_version_tag="${IMAGE_REPOSITORY}:${VERSION#v}"
          for tag in "${version_tag}" "${plain_version_tag}"; do
            if docker buildx imagetools inspect "${tag}" >/dev/null 2>&1; then
              echo "Version image alias already exists: ${tag}" >&2
              exit 1
            fi
          done
          docker push "${sha_tag}" | tee /tmp/docker-push.log
          docker tag "${sha_tag}" "${version_tag}"
          docker tag "${sha_tag}" "${plain_version_tag}"
          docker push "${version_tag}"
          docker push "${plain_version_tag}"
          digest="$(sed -n 's/^.*digest: \(sha256:[0-9a-f]*\).*$/\1/p' /tmp/docker-push.log | tail -1)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo 'Could not resolve published image digest.' >&2
            exit 1
          }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Expose immutable image digest
        id: image
        env:
          IMAGE_REPOSITORY: ${{ steps.image-name.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "image=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Generate image SBOM
        uses: anchore/sbom-action@v0.20.0
        with:
          image: ${{ steps.image-name.outputs.name }}:sha-${{ needs.verify.outputs.source_sha }}
          format: cyclonedx-json
          output-file: ford-scraping-sbom.cdx.json
          artifact-name: ford-scraping-sbom-${{ needs.verify.outputs.source_sha }}.cdx.json
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image-name.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Verify published image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.image }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh attestation verify "oci://${IMAGE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --source-ref "refs/tags/${VERSION}" \
            --source-digest "${SOURCE_SHA}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
      - name: Summarize immutable scraper release
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          {
            echo '### Ford-scraping container'
            echo "- Version: ${VERSION}"
            echo "- Source: ${SOURCE_SHA}"
            echo "- Immutable image: ${IMAGE}"
            echo '- Vulnerability scan: passed'
            echo '- SBOM and build provenance: verified'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy or roll back Ford MCP
    needs: [contract, verify, image]
    if: >-
      always() && needs.contract.result == 'success' && needs.verify.result == 'success' &&
      (needs.verify.outputs.operation == 'rollback' || needs.image.result == 'success') &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      vars.RUNTIME_VAULT_READY == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy using the shared OCI action
        uses: migangdelzar/Ford-oci-deployment-action/.github/actions/oci-blue-green@8e32aec3eabf8207c47c7a601d8d32735f7c0b37
        with:
          target: ford-mcp
          operation: ${{ needs.verify.outputs.operation }}
          image: ${{ needs.verify.outputs.operation == 'rollback' && '' || needs.image.outputs.image }}
          source-sha: ${{ needs.verify.outputs.source_sha }}
          host: ${{ vars.OCI_MCP_HOST }}
          user: ${{ vars.OCI_DEPLOY_USER }}
          ssh-private-key: ${{ secrets.OCI_MCP_SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
          registry-username: ${{ github.actor }}
          registry-token: ${{ github.token }}
          mcp-private-ip: ${{ vars.OCI_MCP_PRIVATE_IP }}
          backup-host: ${{ vars.OCI_DATA_DEPLOY_HOST }}
          backup-user: ${{ vars.OCI_DATA_DEPLOY_USER }}

  release-result:
    name: Record release artifact and deployment identity
    needs: [verify, image, deploy]
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.verify.outputs.operation == 'rollback' || needs.image.result == 'success') &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Write release result manifest
        env:
          OPERATION: ${{ needs.verify.outputs.operation }}
          VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          DEPLOYMENT_RESULT: ${{ needs.deploy.result }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          deployed = os.environ["DEPLOYMENT_RESULT"] == "success"
          result = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "version": os.environ["VERSION"] or None,
              "tag": os.environ["VERSION"] or None,
              "sourceSha": os.environ["SOURCE_SHA"],
              "imageDigest": os.environ["IMAGE_DIGEST"] or None,
              "deploymentId": os.environ["GITHUB_RUN_ID"] if deployed else None,
              "deploymentUrl": "https://ford-mcp.emme.business/mcp" if deployed else None,
          }
          Path(os.environ["RUNNER_TEMP"], "release-result.json").write_text(
              json.dumps(result, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload release result artifact
        uses: actions/upload-artifact@v7
        with:
          name: ford-release-result
          path: ${{ runner.temp }}/release-result.json
          if-no-files-found: error
          retention-days: 90
