name: Release MCP to OCI
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release MCP to OCI [{0}] {1}', inputs.release_request_id || 'manual', inputs.source_sha || 'unspecified') || 'Release MCP to OCI' }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Validate this release workflow, deploy verified main, or restore the prior image.
        required: true
        default: deploy
        type: choice
        options: [validate, deploy, rollback]
      source_sha:
        description: Full 40-character SHA with successful CI on main (deploy only).
        required: false
        type: string
      release_request_id:
        description: Coordinator correlation ID used to track release-all requests.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ford-mcp-production
  cancel-in-progress: false

jobs:
  contract:
    name: Verify release contract without publishing
    if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm release jobs enforce their own operation gates
        run: echo "Release event contract accepted; publication and deployment remain separately gated."

  verify:
    name: Verify release source
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.operation != 'validate')
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.source.outputs.operation }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Resolve the verified release source
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            [[ "${WORKFLOW_RUN_CONCLUSION}" == "success" && "${WORKFLOW_RUN_EVENT}" == "push" && \
              "${WORKFLOW_RUN_BRANCH}" == "main" && "${WORKFLOW_RUN_REPOSITORY,,}" == "${GITHUB_REPOSITORY,,}" ]] || {
              echo "Automatic release requires a successful push CI run from this repository's main branch." >&2
              exit 1
            }
            operation=deploy
            source_sha="${WORKFLOW_RUN_SHA}"
          else
            operation="${REQUESTED_OPERATION}"
            source_sha="${REQUESTED_SHA}"
            if [[ "${operation}" == "rollback" ]]; then
              source_sha=recorded-rollback
            fi
          fi
          if [[ "${operation}" == "deploy" ]]; then
            [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Deploy requires a full 40-character lowercase source SHA." >&2
              exit 1
            }
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=${source_sha}")"
            jq -e --arg sha "${source_sha}" \
            '.workflow_runs | any(.head_sha == $sha and .head_branch == "main" and .conclusion == "success")' \
            <<<"$runs" >/dev/null || {
              echo "Source SHA has no successful push verification run on main." >&2
              exit 1
            }
          elif [[ "${operation}" != "rollback" ]]; then
            echo "Unsupported release operation: ${operation}" >&2
            exit 1
          fi
          echo "operation=${operation}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"

  image:
    name: Build and scan immutable MCP image
    if: needs.verify.result == 'success' && needs.verify.outputs.operation == 'deploy'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v3
      - name: Set up image build cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: scraping-arm64-${{ needs.verify.outputs.source_sha }}
          restore-keys: scraping-arm64-
      - name: Normalize GHCR image name
        id: image-name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build image archive for scanning
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.image-name.outputs.name }}:sha-${{ needs.verify.outputs.source_sha }}
          platforms: linux/arm64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          outputs: type=docker,dest=/tmp/ford-scraping.tar
          provenance: false
          sbom: false
      - name: Rotate image build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
      - name: Scan image
        id: scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/ford-scraping.tar
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          limit-severities-for-sarif: true
          exit-code: '1'
      - name: Upload image scan report
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
      - name: Log in to GHCR after the image passes its scan
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Load and publish the scanned image
        env:
          IMAGE_TAG: ${{ steps.image-name.outputs.name }}:sha-${{ needs.verify.outputs.source_sha }}
        run: |
          set -euo pipefail
          docker load --input /tmp/ford-scraping.tar
          docker push "${IMAGE_TAG}" | tee /tmp/docker-push.log
          digest="$(sed -n 's/^.*digest: \(sha256:[0-9a-f]*\).*$/\1/p' /tmp/docker-push.log | tail -1)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo 'Could not resolve published image digest.' >&2
            exit 1
          }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        id: publish
      - name: Expose immutable image digest
        id: image
        env:
          IMAGE_REPOSITORY: ${{ steps.image-name.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "image=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Generate image SBOM
        uses: anchore/sbom-action@v0.20.0
        with:
          image: ${{ steps.image-name.outputs.name }}:sha-${{ needs.verify.outputs.source_sha }}
          format: cyclonedx-json
          output-file: ford-scraping-sbom.cdx.json
          artifact-name: ford-scraping-sbom-${{ needs.verify.outputs.source_sha }}.cdx.json
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image-name.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Verify published image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          gh attestation verify "oci://${IMAGE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
      - name: Summarize immutable scraper release
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          {
            echo '### Ford-scraping container'
            echo "- Source: ${SOURCE_SHA}"
            echo "- Immutable image: ${IMAGE}"
            echo '- Vulnerability scan: passed'
            echo '- SBOM and build provenance: verified'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy or roll back Ford MCP
    needs: [contract, verify, image]
    if: >-
      always() && needs.contract.result == 'success' && needs.verify.result == 'success' &&
      (needs.verify.outputs.operation == 'rollback' || needs.image.result == 'success') &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      vars.RUNTIME_VAULT_READY == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy using the shared OCI action
        uses: migangdelzar/Ford-oci-deployment-action/.github/actions/oci-blue-green@8e32aec3eabf8207c47c7a601d8d32735f7c0b37
        with:
          target: ford-mcp
          operation: ${{ needs.verify.outputs.operation }}
          image: ${{ needs.verify.outputs.operation == 'rollback' && '' || needs.image.outputs.image }}
          source-sha: ${{ needs.verify.outputs.source_sha }}
          host: ${{ vars.OCI_MCP_HOST }}
          user: ${{ vars.OCI_DEPLOY_USER }}
          ssh-private-key: ${{ secrets.OCI_MCP_SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
          registry-username: ${{ github.actor }}
          registry-token: ${{ github.token }}
          mcp-private-ip: ${{ vars.OCI_MCP_PRIVATE_IP }}
          backup-host: ${{ vars.OCI_DATA_DEPLOY_HOST }}
          backup-user: ${{ vars.OCI_DATA_DEPLOY_USER }}
