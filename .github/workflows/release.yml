name: Release Ford scraper scheduler
run-name: ${{ format('Release Ford scraper scheduler [{0}] {1} {2}', inputs.release_request_id || 'manual', inputs.version || 'rollback', inputs.source_sha || 'recorded') }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy a verified scraper image, restore the prior image, or disable the old cron trigger.
        required: true
        type: choice
        options: [deploy, rollback, disable]
        default: deploy
      version:
        description: Immutable annotated vMAJOR.MINOR.PATCH tag (deploy only).
        required: false
        type: string
      source_sha:
        description: Full commit SHA targeted by the version tag (deploy only).
        required: false
        type: string
      release_request_id:
        description: Coordinator correlation ID used to track release-all requests.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ford-scraper-scheduler-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify versioned scraper source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      operation: ${{ steps.source.outputs.operation }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.source.outputs.version }}
      coordinator_dispatch: ${{ steps.source.outputs.coordinator_dispatch }}
    steps:
      - name: Check out release tooling from main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve and verify release tag and source SHA
        id: source
        env:
          RELEASE_REF: ${{ github.ref }}
          OPERATION: ${{ inputs.operation }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_REQUEST_ID: ${{ inputs.release_request_id }}
          RELEASE_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" == 'refs/heads/main' ]] || {
            echo 'Run scheduler releases from main.' >&2
            exit 1
          }
          coordinator_dispatch=false
          if [[ -n "$RELEASE_REQUEST_ID" ]]; then
            [[ "$RELEASE_ACTOR" == 'ford-release-coordinator[bot]' && "$RELEASE_REQUEST_ID" =~ ^[0-9]+-[0-9]+$ ]] || {
              echo 'Coordinator release request is not authorized.' >&2
              exit 1
            }
            coordinator_run_id="${RELEASE_REQUEST_ID%-*}"
            coordinator_attempt="${RELEASE_REQUEST_ID##*-}"
            coordinator_run="$(gh api "repos/migangdelzar/Ford-uruapan/actions/runs/${coordinator_run_id}")"
            jq -e --arg attempt "$coordinator_attempt" \
              '.path == ".github/workflows/release-all.yml" and .event == "workflow_dispatch" and .head_branch == "main" and .status == "in_progress" and (.run_attempt | tostring) == $attempt' \
              <<<"$coordinator_run" >/dev/null || {
              echo 'Coordinator request does not identify an active release-all run on main.' >&2
              exit 1
            }
            coordinator_jobs="$(gh api "repos/migangdelzar/Ford-uruapan/actions/runs/${coordinator_run_id}/attempts/${coordinator_attempt}/jobs?per_page=100")"
            jq -e '.jobs | any(.name == "Approve and deploy selected releases in order" and .status == "in_progress")' \
              <<<"$coordinator_jobs" >/dev/null || {
              echo 'Coordinator release job is not active; approval may not have been granted.' >&2
              exit 1
            }
            coordinator_dispatch=true
          fi
          echo "coordinator_dispatch=${coordinator_dispatch}" >> "$GITHUB_OUTPUT"
          if [[ "$OPERATION" == 'rollback' ]]; then
            echo 'operation=rollback' >> "$GITHUB_OUTPUT"
            echo 'source_sha=recorded-rollback' >> "$GITHUB_OUTPUT"
            echo 'version=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$OPERATION" == 'disable' ]]; then
            echo 'operation=disable' >> "$GITHUB_OUTPUT"
            echo 'source_sha=recorded-disable' >> "$GITHUB_OUTPUT"
            echo 'version=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'A canonical vMAJOR.MINOR.PATCH version is required.' >&2
            exit 1
          }
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo 'A full source SHA is required.' >&2
            exit 1
          }
          git fetch --no-tags origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
          [[ "$(git cat-file -t "refs/tags/${VERSION}")" == tag ]] || {
            echo 'Release version must be an annotated tag.' >&2
            exit 1
          }
          [[ "$(git rev-parse "refs/tags/${VERSION}^{commit}")" == "$SOURCE_SHA" ]] || {
            echo 'Release tag target does not match the selected source SHA.' >&2
            exit 1
          }
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main || {
            echo 'Release tag target is not reachable from main.' >&2
            exit 1
          }
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SOURCE_SHA}&event=push&status=success&per_page=100" --jq "[.workflow_runs[] | select(.head_branch == \"${VERSION}\")] | length")"
          [[ "$runs" -gt 0 ]] || {
            echo 'No successful scraper CI run exists for this version tag and source SHA.' >&2
            exit 1
          }
          echo 'operation=deploy' >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  image:
    name: Resolve and verify tagged scraper digest
    needs: verify
    if: needs.verify.outputs.operation == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Normalize GHCR image name
        id: repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve and verify version image digest
        id: image
        env:
          IMAGE_REPOSITORY: ${{ steps.repository.outputs.name }}
          VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tagged_image="${IMAGE_REPOSITORY}:${VERSION}"
          docker pull "$tagged_image" >/dev/null
          digest_reference="$(docker image inspect --format '{{index .RepoDigests 0}}' "$tagged_image")"
          [[ "$digest_reference" =~ ^ghcr\.io/[A-Za-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]] || {
            echo 'Published scraper image did not resolve to an immutable digest.' >&2
            exit 1
          }
          gh attestation verify "oci://${digest_reference}" \
            --repo "$GITHUB_REPOSITORY" \
            --source-ref "refs/tags/${VERSION}" \
            --source-digest "$SOURCE_SHA" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ci.yml"
          echo "image=${digest_reference}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest_reference##*@}" >> "$GITHUB_OUTPUT"

  production-readiness:
    name: Require production runtime readiness
    runs-on: ubuntu-24.04
    env:
      PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
      RUNTIME_VAULT_READY: ${{ vars.RUNTIME_VAULT_READY }}
      FORD_SECRETS_PROVIDER: ${{ vars.FORD_SECRETS_PROVIDER }}
    steps:
      - name: Fail clearly when production runtime is not ready
        run: |
          set -euo pipefail
          [[ "$PRODUCTION_DEPLOY_ENABLED" == 'true' ]] || { echo 'Production deploy gate is disabled.' >&2; exit 1; }
          [[ "$RUNTIME_VAULT_READY" == 'true' && "$FORD_SECRETS_PROVIDER" == 'oci-vault' ]] || { echo 'Runtime Vault readiness is not confirmed.' >&2; exit 1; }

  approval:
    name: Approve scraper scheduler production change
    needs: [verify, image, production-readiness]
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.verify.outputs.operation != 'deploy' || needs.image.result == 'success') &&
      needs.production-readiness.result == 'success' && needs.verify.outputs.coordinator_dispatch != 'true'
    runs-on: ubuntu-24.04
    environment: manual-release-approval
    steps:
      - run: echo 'Scraper scheduler release approved.'

  deploy:
    name: Deploy scheduler on emme-2
    needs: [verify, image, production-readiness, approval]
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.verify.outputs.operation != 'deploy' || needs.image.result == 'success') &&
      needs.production-readiness.result == 'success' &&
      (needs.verify.outputs.coordinator_dispatch == 'true' || needs.approval.result == 'success') &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' && vars.RUNTIME_VAULT_READY == 'true'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy private scheduler through the shared OCI action
        uses: migangdelzar/Ford-oci-deployment-action/.github/actions/oci-blue-green@24a04391a4d54e4a30a8a655ccdf0241f68ff659
        with:
          target: ford-scraper-scheduler
          operation: ${{ needs.verify.outputs.operation }}
          image: ${{ needs.verify.outputs.operation != 'deploy' && '' || needs.image.outputs.image }}
          source-sha: ${{ needs.verify.outputs.source_sha }}
          host: ${{ vars.OCI_MCP_HOST }}
          user: ${{ vars.OCI_DEPLOY_USER }}
          ssh-private-key: ${{ secrets.OCI_MCP_SSH_PRIVATE_KEY }}
          backup-ssh-private-key: ${{ secrets.OCI_MCP_SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
          registry-username: ${{ github.repository_owner }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          remote-root: /opt/ford-uruapan
          backup-host: ${{ vars.OCI_DATA_DEPLOY_HOST }}
          backup-user: ${{ vars.OCI_DATA_DEPLOY_USER }}
          secrets-provider: oci-vault
          scheduler-postgres-password-secret-ocid: ${{ vars.FORD_VAULT_SECRET_OCID_POSTGRES_PASSWORD }}

  release-result:
    name: Record release artifact and deployment identity
    needs: [verify, image, production-readiness, deploy]
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.verify.outputs.operation != 'deploy' || needs.image.result == 'success') &&
      needs.production-readiness.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Write release result manifest
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          DEPLOYMENT_RESULT: ${{ needs.deploy.result }}
          OPERATION: ${{ needs.verify.outputs.operation }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          deployed = os.environ["DEPLOYMENT_RESULT"] == "success"
          result = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "operation": os.environ["OPERATION"],
              "version": os.environ["VERSION"] or None,
              "tag": os.environ["VERSION"] or None,
              "sourceSha": os.environ["SOURCE_SHA"],
              "imageDigest": os.environ["IMAGE_DIGEST"] or None,
              "deploymentId": os.environ["GITHUB_RUN_ID"] if deployed else None,
              "deploymentUrl": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}" if deployed else None,
          }
          Path(os.environ["RUNNER_TEMP"], "release-result.json").write_text(
              json.dumps(result, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload release result artifact
        uses: actions/upload-artifact@v7
        with:
          name: ford-release-result
          path: ${{ runner.temp }}/release-result.json
          if-no-files-found: error
          retention-days: 90
