services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ford
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ford"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ford-postgres-data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ford-ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-model:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ford-ollama-models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull qllama/bge-m3:q8_0"]
    restart: "no"

  scheduler:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ford
      FORD_BASE_URL: https://www.forduruapan.mx
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_API_URL: http://ollama:11434/api/embed
      EMBEDDING_MODEL: qllama/bge-m3:q8_0
      EMBEDDING_DIMENSIONS: "1024"
      CRAWL_MAX_PAGES: "1000"
      SYNC_SCHEDULE: "0 12 * * *"
      SYNC_TIMEZONE: America/Mexico_City
    command: ["sh", "-c", "node dist/src/cli.js migrate && node dist/src/cli.js scheduler"]

volumes:
  ford-postgres-data:
  ford-ollama-models:
